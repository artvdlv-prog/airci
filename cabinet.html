<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.8em' font-size='45' font-family='Arial,sans-serif' font-weight='bold' fill='%23FF6A00'>AI</text></svg>">
    <meta name="description" content="Личный кабинет AIRCHITECT: дашборд, специалисты, исполнение договоров, документы и реестры.">
    <title>Личный кабинет | AIRCHITECT</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="home-cab__top" data-cab-top>
        <a href="index.html" class="home-cab__top-logo"><img src="Logo Airchitect.jpg" alt="Airchitect"></a>
        <div class="home-cab__account" data-cab-account hidden>
            <span class="home-cab__account-text">
                <span class="home-cab__account-company" data-cab-company></span>
                <span class="home-cab__account-meta"><span data-cab-product></span> <span data-cab-user></span></span>
            </span>
            <button type="button" class="home-cab__logout" data-cab-logout>Выйти</button>
        </div>
    </header>

    <main class="home" data-cabinet>
        <section class="home-cab" id="intro">
            <div class="home-cab__layout">
                <aside class="home-cab__side" data-cab-side hidden>
                    <nav aria-label="Разделы кабинета">
                        <ul class="home-cab__nav" data-cab-nav></ul>
                    </nav>
                    <a href="index.html" class="home-cab__back">← На сайт</a>
                </aside>
                <div class="home-cab__main" data-cab-main>
                    <div class="home-cab__panel" data-cab-panel></div>
                    <div class="home-cab__frame-wrap" data-cab-frame-wrap hidden>
                        <iframe class="home-cab__frame" data-cab-frame title="Раздел кабинета"></iframe>
                    </div>
                </div>
            </div>
        </section>
        <dialog class="home-dialog" data-ct-dialog>
            <form method="dialog" class="home-dialog__form">
                <div class="home-dialog__head">
                    <h2 class="home-dialog__title" data-ct-dialog-title></h2>
                    <button type="button" class="home-window__close" data-ct-dialog-close aria-label="Закрыть">×</button>
                </div>
                <div class="home-dialog__body" data-ct-dialog-body></div>
                <p class="home-dialog__error" data-ct-dialog-error hidden></p>
                <div class="home-dialog__foot" data-ct-dialog-foot></div>
            </form>
        </dialog>
    </main>

    <script src="translations.js"></script>
    <script src="home-config.js"></script>
    <script src="script.js"></script>
    <script src="cashflow-core.js"></script>
    <script src="estimates-core.js"></script>
    <script src="counterparty-core.js"></script>
    <script src="contract-core.js"></script>
    <script src="cabinet.js"></script>
</body>
</html>
