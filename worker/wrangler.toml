name = "airchitect-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Secrets are not stored here. Set them once:
#   npx wrangler secret put ANTHROPIC_API_KEY   — the Claude API key
#   npx wrangler secret put SETUP_TOKEN         — one-time code for creating the first company (POST /api/setup)
# For local runs put them into worker/.dev.vars (the file is in .gitignore).

[vars]
# Sites allowed to call the API (comma-separated)
ALLOWED_ORIGINS = "https://www.airchi.tech,https://airchi.tech"
# Model and answer size; effort of ordinary answers (low | medium | high)
MODEL = "claude-opus-5-5"
MAX_TOKENS = "16000"
EFFORT = "medium"
# Limits of use and spending
USER_DAILY_REQUESTS = "150"
COMPANY_MONTHLY_BUDGET_USD = "200"
# Prices per million tokens for the spending estimate (Claude Opus 5.5)
PRICE_INPUT_PER_MTOK = "4"
PRICE_OUTPUT_PER_MTOK = "20"
PRICE_CACHE_WRITE_PER_MTOK = "5"
PRICE_CACHE_READ_PER_MTOK = "0.2"
# Documents
MAX_FILE_MB = "15"
MAX_PDF_PAGES = "300"
MAX_DOCUMENT_CHARS = "600000"
MAX_REQUEST_PDF_MB = "28"
MAX_CONTEXT_CHARS = "1500000"

# Database: accounts, projects, dialogs, results. Create: npx wrangler d1 create airchitect
[[d1_databases]]
binding = "DB"
database_name = "airchitect"
database_id = "REPLACE_WITH_DATABASE_ID"
migrations_dir = "migrations"

# Files of the documents (original and extracted text), by company and project. Create: npx wrangler r2 bucket create airchitect-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "airchitect-files"

# Requests to the model: 20 per minute per employee
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Sign-in attempts: 10 per minute per IP address (plus a lock after 5 wrong passwords for an e-mail)
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
